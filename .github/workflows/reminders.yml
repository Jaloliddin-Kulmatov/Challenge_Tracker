# Sends the daily "tick your day" emails and Telegram messages (and keeps the Telegram webhook registered). GitHub's scheduler is best-effort (runs can be a few minutes late),
# which is fine: the endpoint is idempotent and catches up for a few hours.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://challenge-tracker-bay.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
name: Reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 3 --retry-delay 5 --max-time 60 \
            "$APP_URL/api/cron/reminders")
          cat response.json; echo
          test "$code" = "200"
